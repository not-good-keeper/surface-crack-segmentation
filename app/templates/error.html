<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ headline }} &mdash; Surface Defect Inspection</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
  <header class="app-bar">
    <span class="app-bar__title">Surface Defect Inspection</span>
    <span class="app-bar__station">{{ station }}</span>
  </header>
  <div class="shell">
    {% include "partials/navigation.html" %}
    <main id="main" class="main">
      <div class="panel empty-state">
        <h1>{{ headline }}</h1>
        <p>{{ detail }}</p>
        <p><a class="button button--primary" href="/live">Go to Live Inspection</a></p>
      </div>
    </main>
  </div>
</body>
</html>
